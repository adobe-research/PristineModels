image_size: 512
prompt_length: 256
num_workers: 2
dataloader_prefetch: 2

t5_name: google/flan-t5-large
patch_size: 32
hidden_size: 768
text_hidden_size: 768
t5_hidden_size: 1024
depth_double: 17
text_preamble_depth: 2
num_heads: 12
head_dim: 64
pca_channels: 128
attention_impl: sdpa
compile_model: true

# Reference total for eight GPUs; micro_batch_size is per GPU.
batch_size: 1024
micro_batch_size: 128
grad_accum_steps: 1
num_steps: 250000
warmup_steps: 5000
learning_rate: 0.0004
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 0.0
ema_decay: 0.99995
amp_dtype: bf16

prediction: x
t_sample_schedule: lognorm
t_lognorm_mu: -0.8
t_lognorm_sigma: 0.8
label_drop_rate: 0.1
noise_scale: 2.0
n_T: 200
cfg_scale: 3.0

log_every: 100
latest_every: 500
log_images_every: 1000
sample_every: 10000
# Keep numbered archives every 100k; overwrite latest every 500 and at run end.
ckpt_every: 100000
save_keep: 0
auto_resume: true
